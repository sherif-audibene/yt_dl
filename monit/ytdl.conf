# Monit checks for ytdl. Installed to /etc/monit/conf.d/ by the Jenkins deploy.
# The app runs under PM2 as the jenkins user; PATH must include node (Jenkins NodeJS tool) and yt-dlp.

check host ytdl with address 127.0.0.1
  # "pm2 resurrect" covers the case where the PM2 daemon itself died
  restart program = "/bin/su - jenkins -s /bin/sh -c 'export PATH=/var/lib/jenkins/tools/jenkins.plugins.nodejs.tools.NodeJSInstallation/NodeJS/bin:/usr/local/bin:$PATH; cd /var/www/ytdl && (npx pm2 restart ytdl || npx pm2 resurrect)'"
    with timeout 60 seconds
  # 401 = up and behind Basic Auth
  if failed port 3000 protocol http request "/" status = 401 for 2 cycles then restart
  if 3 restarts within 10 cycles then alert

# Downloads are kept forever, so watch the disk
check filesystem ytdl_storage with path /storage
  if space usage > 90% then alert
